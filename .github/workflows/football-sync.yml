name: Football data synchronization

on:
  schedule:
    # Core data is refreshed every three hours, offset from the busiest minute.
    - cron: '17 */3 * * *'
    # Match windows are checked every 30 minutes. The server decides which
    # fixtures actually need a provider call and enforces the daily quota.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Data to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - lineup_window
          - date
          - competition
          - fixture
      date:
        description: Date in YYYY-MM-DD format (required for date scope)
        required: false
        type: string
      competition_code:
        description: Competition code, for example PL or UCL
        required: false
        type: string
      fixture_id:
        description: Internal fixture UUID (required for fixture scope)
        required: false
        type: string
      priority:
        description: Queue priority for a manual request
        required: true
        default: '9'
        type: choice
        options:
          - '5'
          - '7'
          - '9'

# This workflow does not read repository contents and does not need GITHUB_TOKEN.
permissions: {}

concurrency:
  group: betledger-football-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize football data
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      BETLEDGER_AUTOMATION_SECRET: ${{ secrets.BETLEDGER_AUTOMATION_SECRET }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
      MANUAL_SCOPE: ${{ inputs.scope }}
      MANUAL_DATE: ${{ inputs.date }}
      MANUAL_COMPETITION: ${{ inputs.competition_code }}
      MANUAL_FIXTURE_ID: ${{ inputs.fixture_id }}
      MANUAL_PRIORITY: ${{ inputs.priority }}
    steps:
      - name: Validate request and invoke the sync function
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo '::error::The SUPABASE_URL repository secret is not configured.'
            exit 1
          fi
          if [[ "${SUPABASE_URL}" != https://* ]]; then
            echo '::error::SUPABASE_URL must use HTTPS.'
            exit 1
          fi
          if [[ ${#BETLEDGER_AUTOMATION_SECRET} -lt 32 ]]; then
            echo '::error::BETLEDGER_AUTOMATION_SECRET is missing or too short.'
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == 'schedule' ]]; then
            case "${SCHEDULE_EXPRESSION}" in
              '17 */3 * * *')
                scope='all'
                priority='5'
                ;;
              '*/30 * * * *')
                scope='lineup_window'
                priority='7'
                ;;
              *)
                echo '::error::Unknown schedule expression.'
                exit 1
                ;;
            esac
          else
            scope="${MANUAL_SCOPE}"
            priority="${MANUAL_PRIORITY}"
          fi

          idempotency_key="github-actions:${GITHUB_WORKFLOW}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${scope}"
          base_url="${SUPABASE_URL%/}"

          case "${scope}" in
            all|lineup_window)
              endpoint='sync-football'
              payload="$(jq -cn \
                --arg scope "${scope}" \
                --arg key "${idempotency_key}" \
                --argjson priority "${priority}" \
                '{scope: $scope, priority: $priority, idempotency_key: $key}')"
              ;;
            date)
              if [[ ! "${MANUAL_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo '::error::The date scope requires a date in YYYY-MM-DD format.'
                exit 1
              fi
              endpoint='sync-football'
              payload="$(jq -cn \
                --arg scope "${scope}" \
                --arg date "${MANUAL_DATE}" \
                --arg key "${idempotency_key}" \
                --argjson priority "${priority}" \
                '{scope: $scope, date: $date, priority: $priority, idempotency_key: $key}')"
              ;;
            competition)
              if [[ ! "${MANUAL_COMPETITION}" =~ ^[A-Za-z0-9_-]{2,20}$ ]]; then
                echo '::error::The competition scope requires a valid competition code.'
                exit 1
              fi
              endpoint='sync-football'
              payload="$(jq -cn \
                --arg scope "${scope}" \
                --arg competition "${MANUAL_COMPETITION^^}" \
                --arg key "${idempotency_key}" \
                --argjson priority "${priority}" \
                '{scope: $scope, competition_code: $competition, priority: $priority, idempotency_key: $key}')"
              ;;
            fixture)
              if [[ ! "${MANUAL_FIXTURE_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
                echo '::error::The fixture scope requires a valid internal fixture UUID.'
                exit 1
              fi
              endpoint='refresh-fixture'
              payload="$(jq -cn \
                --arg fixture "${MANUAL_FIXTURE_ID}" \
                --arg key "${idempotency_key}" \
                '{fixture_id: $fixture, idempotency_key: $key}')"
              ;;
            *)
              echo '::error::Unsupported synchronization scope.'
              exit 1
              ;;
          esac

          response_file="$(mktemp "${RUNNER_TEMP}/football-sync.XXXXXX")"
          trap 'rm -f "${response_file}"' EXIT

          set +e
          http_code="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 300 \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-betledger-automation: ${BETLEDGER_AUTOMATION_SECRET}" \
            --data "${payload}" \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "${base_url}/functions/v1/${endpoint}")"
          curl_status=$?
          set -e

          if [[ ${curl_status} -ne 0 ]]; then
            echo "::error::Football synchronization failed (HTTP ${http_code:-unavailable})."
            if [[ -s "${response_file}" ]]; then
              head -c 4000 "${response_file}"
              echo
            fi
            exit "${curl_status}"
          fi

          echo "Football synchronization accepted (HTTP ${http_code})."
          if [[ -s "${response_file}" ]]; then
            jq -c '.' "${response_file}" 2>/dev/null || head -c 4000 "${response_file}"
          fi
